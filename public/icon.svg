<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Polished Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFAD4" />
      <stop offset="40%" stop-color="#D1A751" />
      <stop offset="70%" stop-color="#A88134" />
      <stop offset="100%" stop-color="#875E1A" />
    </linearGradient>
  </defs>
  
  {/* Rounded Obsidian Backdrop Circle */}
  <rect width="100" height="100" rx="22" fill="#08080a" />
  
  {/* Thin Polished Gold Border */}
  <rect width="90" height="90" x="5" y="5" rx="18" stroke="url(#favGold)" stroke-width="2" stroke-opacity="0.4" />
  
  {/* Bold MK Brand Initials */}
  <text 
    x="50" 
    y="66" 
    fill="url(#favGold)" 
    font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="44" 
    text-anchor="middle" 
    letter-spacing="-0.04em"
  >
    MK
  </text>
</svg>
